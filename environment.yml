name: bio-dev
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:

  - python=3.9
  - pip
  
  # Bioinformatics tools
  - blast=2.5.0
  - bowtie2=2.5.5
  - samtools=1.21
  - kraken2=2.0.8_beta
  - megahit=1.2.9
  - gfatools=0.5.5
  - sra-tools=2.10.0
  - htslib=1.21
  - spades
  
  # system's utility
  - wget
  - rsync
  
  # python dependencies
  - numpy=2.0.2
  - scipy=1.13.1
  - pytest

  - pip:
      - graphbin2==1.3.3
      - black